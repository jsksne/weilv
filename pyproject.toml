[project]
name = "weilv"
version = "0.1.0"
description = "微律：青少年个性化健康微行动支持系统"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dashscope>=1.24,<2",
    "elasticsearch>=8.19,<9",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.2.11",
    "markitdown[pdf]>=0.1,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weilv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a running local Elasticsearch instance",
    "live_model: requires a real DASHSCOPE_API_KEY and calls paid model APIs",
]
filterwarnings = [
    "ignore:The Assistants API .* is deprecated:DeprecationWarning:dashscope",
]

[tool.ruff]
line-length = 100
target-version = "py312"
